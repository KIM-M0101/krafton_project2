

services:
  # PostgreSQL DB Container
  db:
    
    image: postgres:16
    ports:
      
      - "5432:5432"
    environment:
      
      POSTGRES_DB: tistory_clone
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    volumes:
      
      - pgdata:/var/lib/postgresql/data

  # FastAPI backend container
  backend:
    # ./backend 폴더의 Dockerfile을 사용해서 백엔드 이미지를 빌드
    build: ./backend
    ports:
      
      - "8000:8000"
    depends_on:
      # backend를 실행하기 전에 db 컨테이너를 먼저 시작
      - db
    env_file:
      # 환경변수 주입
      - ./backend/.env
    volumes:
      # 로컬 코드 수정이 컨테이너 안에도 바로 반영. 배포 시 제거.
      - ./backend/app:/app/app
  # Django blog API container
  django:
    build: ./backend/tistory-backend
    ports:
      - "8001:8001"
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/tistory-backend/.env
    volumes:
      - ./backend/tistory-backend:/app
    # DB가 준비되고 FastAPI가 users 테이블을 만들 때까지 migrate를 재시도한 뒤 서버 실행.
    # (blog 테이블이 users 테이블을 참조하므로 순서가 중요 → 성공할 때까지 반복)
    command: sh -c "until python manage.py migrate --noinput; do echo 'DB/users 준비 대기...'; sleep 2; done && python manage.py runserver 0.0.0.0:8001"

  # Next.js 프론트엔드 컨테이너 (백엔드랑 같은 EC2에서 http로 같이 서빙 -> Mixed Content 문제 회피)
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - django

volumes:
  # PostgreSQL 데이터가 저장되는 Docker volume
  pgdata:

